name: Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile app.py pipeline_core_en.py pipeline_core.py tracker_core.py astrometry.py ai_train.py

      - name: Import app and verify ML model
        run: |
          python - <<'PY'
          import app
          assert app.AI is not None, f"ML model failed to load: {app.AI_LOAD_ERROR}"
          print("App import OK")
          print("RandomForest model active")
          print("Features:", app.AI.get("features"))
          PY

      - name: Run 2024 WZ53 sample end-to-end
        run: |
          python - <<'PY'
          import time
          import app
          # Benchmark the initial UX without blocking on the external SkyBoT catalogue.
          app.known_object_labels = lambda records, wcs, ref: ({r["rank"]: None for r in records}, "off")
          t0 = time.perf_counter()
          out = app.analyze_sample()
          elapsed = time.perf_counter() - t0
          assert isinstance(out, tuple), type(out)
          assert len(out) == 16, f"Expected 16 UI outputs, got {len(out)}"
          assert isinstance(out[8], dict), "Analysis state missing"
          print(f"SAMPLE_NO_CATALOG_OK elapsed={elapsed:.2f}s")
          print("SUMMARY:", str(out[7])[:1000])
          print("CANDIDATES:", len(out[8].get("records", [])))
          PY
